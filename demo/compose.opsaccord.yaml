# Local resource override for the pinned Astronomy Shop revision.
#
# This file changes *only* resource limits. It does not touch a service image, a
# port, an environment address, a feature flag, or anything the Phase 1 fault and
# remediation model depends on.
#
# Why it is needed: on this Docker Desktop / WSL2 host the pinned revision's
# checkout service never becomes healthy. Upstream caps it at
# `memory: 20M` with `GOMEMLIMIT=16MiB`; at that ceiling the Go runtime sits in a
# GC loop, the process spins at ~700% CPU while holding 18.1MiB of its 20MiB, and
# its gRPC server never accepts a connection on :5050
# (`grpc_health_probe -addr=:5050` -> "failed to connect service within 1s",
# 118 consecutive failures). checkout is the service that calls Payment, so the
# Payment path cannot be demonstrated against the real stack while it is wedged.
#
# The host has 15.5 GB of RAM with ~9.5 GB free, so the limit is the binding
# constraint rather than the machine. Raising the pair to a normal Go ratio
# (GOMEMLIMIT at ~75% of the cgroup limit) clears the GC loop.
#
# product-catalog carries the identical upstream pair and was raised the same way on
# 2026-10-18, after a capture taken *during* a hang (before any restart) measured the
# same signature: 621.78% and 423.99% CPU while holding 19.51 MiB and 17.77 MiB of its
# 20 MiB, gRPC health probe failing, every OTLP export timing out, and
# GET /api/products hanging past 8 s. Its database was ruled out in the same capture
# (11 idle connections of 100, none waiting). Earlier samples taken while the catalog
# was quiet could not decide the question; this one could. A restart alone re-entered
# the hang within about seven minutes.
#
# astronomy-db (the catalog's PostgreSQL) was raised from 80M on 2026-10-18 after it was
# found with oom_killed=true at 66-68 MiB of its 80 MiB while idle: PostgreSQL survives a
# killed backend by dropping every connection and recovering, which the healthcheck reads
# as unhealthy, and compose then refused to start the catalog that depends on it. It has
# no data volume; a recreated container reseeds from the pinned init.sql.
#
# The report and docs/astronomy-shop.md record all three as environment deviations.
services:
  checkout:
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      GOMEMLIMIT: 192MiB
  product-catalog:
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      GOMEMLIMIT: 192MiB
  astronomy-db:
    deploy:
      resources:
        limits:
          memory: 256M
