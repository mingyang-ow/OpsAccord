[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsaccord"
version = "0.1.0.dev0"
description = "Incident response with evidence-backed diagnosis and policy-controlled remediation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/opsaccord"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
